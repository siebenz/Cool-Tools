<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Batch Converter & Editor</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

    <style>
        :root {
            /* Dark Mode (Default) */
            --bg: #1e1e24;
            --surface: #2b2b36;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --text: #f8f9fa;
            --border: #4a4a5a;
            --grid-bg: #18181c;
        }

        [data-theme="light"] {
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #111827;
            --border: #d1d5db;
            --grid-bg: #e5e7eb;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        h1 { margin-top: 0; text-align: center; font-size: 1.8rem; }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
            color: #a0a0b0;
            position: relative;
        }

        .drop-zone:hover, .drop-zone.dragover { border-color: var(--primary); background-color: rgba(79, 70, 229, 0.1); color: var(--primary); }

        .progress-bar-container {
            display: none;
            width: 100%;
            background: var(--grid-bg);
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-bar { height: 8px; background: var(--primary); width: 0%; transition: width 0.1s linear; }

        .controls { display: none; flex-direction: column; gap: 20px; }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            background: var(--grid-bg);
            padding: 15px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .preview-item {
            position: relative;
            aspect-ratio: 1;
            background: var(--surface);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            border: 2px solid transparent;
        }

        .preview-item:active { cursor: grabbing; }
        .preview-item.drag-over { border-color: var(--primary); }

        .preview-item img { max-width: 100%; max-height: 100%; object-fit: contain; transition: opacity 0.2s; }
        .preview-item:hover img { opacity: 0.5; }

        .edit-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.6);
            color: white;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .preview-item:hover .edit-overlay { opacity: 1; }

        .badge { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.8); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; pointer-events: none; }
        
        .delete-btn {
            position: absolute;
            top: 5px; right: 5px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px; height: 24px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .preview-item:hover .delete-btn { opacity: 1; }

        .action-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        
        .settings-box {
            background: var(--grid-bg);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        select, button, input[type="number"], input[type="text"], input[type="range"] {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            background-color: var(--surface);
            color: var(--text);
        }

        button { font-weight: bold; cursor: pointer; border: none; transition: background 0.2s; }
        .btn-primary { background-color: var(--primary); color: white; flex: 2; min-width: 150px; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--success); color: white; flex: 2; min-width: 150px; }
        .btn-success:hover { background-color: var(--success-hover); }
        .btn-danger { background-color: var(--danger); color: white; flex: 1; }
        .btn-secondary { background-color: #4b5563; color: white; flex: 1; }
        
        .icon-btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 8px; display: flex; align-items: center; justify-content: center;}
        .icon-btn:hover { background: var(--border); }

        /* Modal Styles */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.85); z-index: 1000;
            align-items: center; justify-content: center; padding: 20px;
        }

        .modal-content {
            background: var(--surface); padding: 20px; border-radius: 12px;
            width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px;
            max-height: 90vh; overflow-y: auto;
        }

        .editor-layout { display: flex; gap: 20px; min-height: 50vh; flex-wrap: wrap; }
        .cropper-container-wrapper { flex: 2; background: #000; border-radius: 8px; overflow: hidden; min-width: 300px; }
        img#cropperImage { display: block; max-width: 100%; }

        .editor-sidebar { flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 15px; }
        .editor-sidebar label { font-size: 0.85rem; color: #a0a0b0; font-weight: bold; display: block; margin-bottom: 5px;}
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .slider-group { display: flex; align-items: center; gap: 10px; }
        .slider-group input { flex: 1; }
    </style>
</head>
<body>

    <div class="container">
        <button class="theme-toggle" id="themeToggle" title="Toggle Theme">☀️</button>
        <h1>Ultimate Batch Converter</h1>
        
        <div class="drop-zone" id="dropZone">
            <div id="dropText">📁 Click, drop multiple files,<br>or paste an image (Ctrl+V / Cmd+V)</div>
            <div class="progress-bar-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
        <input type="file" id="fileInput" multiple style="display:none" accept="image/png, image/jpeg, image/webp, application/pdf">

        <div class="controls" id="controls">
            <div style="font-size: 0.9rem; color: #a0a0b0; display: flex; justify-content: space-between;">
                <span>Drag to reorder. Click thumbnail to edit.</span>
                <span id="itemCount">0 items</span>
            </div>
            
            <div class="preview-grid" id="previewGrid"></div>
            
            <div class="action-row">
                <button class="btn-secondary" id="copyBtn">📋 Copy 1st Image</button>
                <button class="btn-danger" id="clearBtn">🗑️ Clear All</button>
            </div>

            <div class="settings-box">
                <div style="flex: 1; min-width: 200px;">
                    <label style="display:block; font-size: 0.85rem; margin-bottom: 5px; color: var(--text);">Export Format:</label>
                    <select id="formatSelect" style="width: 100%;">
                        <option value="image/png">PNG</option>
                        <option value="image/jpeg">JPG / JPEG</option>
                        <option value="image/webp">WEBP</option>
                    </select>
                </div>
                <div style="flex: 1; min-width: 200px;">
                    <label style="display:block; font-size: 0.85rem; margin-bottom: 5px; color: var(--text);">Quality (JPG/WEBP): <span id="qualityVal">92%</span></label>
                    <input type="range" id="qualitySlider" min="0.1" max="1" step="0.01" value="0.92" style="width: 100%;">
                </div>
            </div>

            <div class="action-row">
                <button class="btn-primary" id="convertBtn">Download Images (ZIP)</button>
                <button class="btn-success" id="mergePdfBtn">📄 Merge into PDF</button>
            </div>
        </div>
    </div>

    <div class="modal" id="editorModal">
        <div class="modal-content">
            <h2>Advanced Editor</h2>
            <div class="editor-layout">
                <div class="cropper-container-wrapper"><img id="cropperImage" src=""></div>
                
                <div class="editor-sidebar">
                    <div>
                        <label>Transform & Aspect Ratio</label>
                        <div class="grid-2" style="margin-bottom: 8px;">
                            <button class="icon-btn" onclick="cropper.rotate(-90)">↺ Rotate L</button>
                            <button class="icon-btn" onclick="cropper.rotate(90)">↻ Rotate R</button>
                            <button class="icon-btn" onclick="flipX()">↔ Flip H</button>
                            <button class="icon-btn" onclick="flipY()">↕ Flip V</button>
                        </div>
                        <div class="grid-2" id="ratioControls">
                            <button class="icon-btn active" data-ratio="NaN" style="border-color: var(--primary);">Free Crop</button>
                            <button class="icon-btn" data-ratio="1">1:1 Square</button>
                            <button class="icon-btn" data-ratio="1.7777777777777777">16:9</button>
                            <button class="icon-btn" data-ratio="1.3333333333333333">4:3</button>
                        </div>
                    </div>

                    <div>
                        <label>Color Filters</label>
                        <div class="slider-group"><span style="width:30px;">☀️</span><input type="range" id="f-bright" min="50" max="150" value="100"></div>
                        <div class="slider-group"><span style="width:30px;">🌗</span><input type="range" id="f-cont" min="50" max="150" value="100"></div>
                        <div class="slider-group"><span style="width:30px;">🌈</span><input type="range" id="f-sat" min="0" max="200" value="100"></div>
                        <div style="margin-top: 5px;">
                            <input type="checkbox" id="f-gray"> <label for="f-gray" style="display:inline; font-weight:normal;">Grayscale</label>
                        </div>
                    </div>

                    <div>
                        <label>Output Size (px)</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="number" id="resizeW" placeholder="Width" style="width: 50%;">
                            <input type="number" id="resizeH" placeholder="Height" style="width: 50%;">
                        </div>
                    </div>
                    
                    <div>
                        <label>Watermark (Bottom Right)</label>
                        <input type="text" id="watermarkText" placeholder="e.g., Copyright 2026" style="width: 100%; box-sizing: border-box;">
                    </div>

                    <div style="flex: 1;"></div>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <button class="btn-secondary" id="cancelEditBtn">Cancel</button>
                        <button class="btn-primary" id="applyEditBtn">Apply to Image</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Setup PDF Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // State
        let uploadedImages = []; 
        let cropper = null;
        let currentEditIndex = -1;
        let scaleX = 1; let scaleY = 1;
        let draggedIndex = null;

        // Elements
        const DOM = {
            dropText: document.getElementById('dropText'),
            progCont: document.getElementById('progressContainer'),
            progBar: document.getElementById('progressBar'),
            grid: document.getElementById('previewGrid'),
            controls: document.getElementById('controls'),
            count: document.getElementById('itemCount')
        };

        // --- Theme Toggle ---
        document.getElementById('themeToggle').addEventListener('click', (e) => {
            const isLight = document.body.getAttribute('data-theme') === 'light';
            document.body.setAttribute('data-theme', isLight ? 'dark' : 'light');
            e.target.innerText = isLight ? '☀️' : '🌙';
        });

        // --- File Inputs ---
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFiles(e.target.files); });
        window.addEventListener('paste', (e) => {
            let files = [];
            for (let item of e.clipboardData.items) { if (item.type.startsWith('image/')) files.push(item.getAsFile()); }
            if (files.length) handleFiles(files);
        });

        // --- Core Processing Logic ---
        async function handleFiles(files) {
            DOM.dropText.innerText = `Processing ${files.length} file(s)...`;
            DOM.progCont.style.display = 'block';
            DOM.progBar.style.width = '0%';

            let totalTasks = 0; let completedTasks = 0;
            
            // First pass: count pages for progress bar accurately
            for (let file of files) {
                if (file.type === 'application/pdf') {
                    const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
                    totalTasks += pdf.numPages;
                    file._pdfCache = pdf; // cache to avoid re-parsing
                } else if (file.type.startsWith('image/')) {
                    totalTasks += 1;
                }
            }

            for (let file of files) {
                try {
                    if (file.type === 'application/pdf') {
                        const pdf = file._pdfCache;
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const viewport = page.getViewport({scale: 2.0}); 
                            const canvas = document.createElement('canvas');
                            canvas.width = viewport.width; canvas.height = viewport.height;
                            await page.render({canvasContext: canvas.getContext('2d'), viewport: viewport}).promise;
                            await addImg(canvas.toDataURL('image/png'));
                            
                            completedTasks++;
                            DOM.progBar.style.width = `${(completedTasks/totalTasks)*100}%`;
                        }
                    } else if (file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        const dataUrl = await new Promise(r => { reader.onload = e => r(e.target.result); reader.readAsDataURL(file); });
                        await addImg(dataUrl);
                        
                        completedTasks++;
                        DOM.progBar.style.width = `${(completedTasks/totalTasks)*100}%`;
                    }
                } catch (err) { console.error(err); }
            }
            
            setTimeout(() => {
                DOM.dropText.innerHTML = "📁 Click, drop multiple files,<br>or paste an image (Ctrl+V / Cmd+V)";
                DOM.progCont.style.display = 'none';
                fileInput.value = "";
            }, 500);
        }

        function addImg(src) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => { uploadedImages.push({ element: img }); renderGrid(); resolve(); };
                img.src = src;
            });
        }

// --- Grid & Drag-Drop Logic ---
        function renderGrid() {
            DOM.grid.innerHTML = '';
            if (uploadedImages.length === 0) { DOM.controls.style.display = 'none'; return; }
            
            DOM.controls.style.display = 'flex';
            DOM.count.innerText = `${uploadedImages.length} items`;
            
            uploadedImages.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.draggable = true;
                
                // FIXED: Click event is now on the main div, not the unclickable overlay
                div.onclick = () => openEditor(index);
                
                div.addEventListener('dragstart', () => draggedIndex = index);
                div.addEventListener('dragover', e => { e.preventDefault(); div.classList.add('drag-over'); });
                div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
                div.addEventListener('drop', e => {
                    e.preventDefault();
                    div.classList.remove('drag-over');
                    const targetIndex = index;
                    const draggedItem = uploadedImages.splice(draggedIndex, 1)[0];
                    uploadedImages.splice(targetIndex, 0, draggedItem);
                    renderGrid();
                });
                
                const cloneImg = new Image(); cloneImg.src = item.element.src;
                
                const overlay = document.createElement('div'); overlay.className = 'edit-overlay'; overlay.innerText = '✏️ Edit';

                const badge = document.createElement('div'); badge.className = 'badge'; badge.innerText = index + 1;
                
                const delBtn = document.createElement('button'); delBtn.className = 'delete-btn'; delBtn.innerHTML = '✕';
                delBtn.title = "Remove";
                
                // The e.stopPropagation() here ensures clicking delete doesn't ALSO open the editor
                delBtn.onclick = (e) => { e.stopPropagation(); uploadedImages.splice(index, 1); renderGrid(); };

                div.append(cloneImg, overlay, badge, delBtn);
                DOM.grid.appendChild(div);
            });
        }

        // --- Editor Logic ---
        function openEditor(index) {
            currentEditIndex = index;
            scaleX = 1; scaleY = 1;
            document.getElementById('cropperImage').src = uploadedImages[index].element.src;
            document.getElementById('editorModal').style.display = 'flex';
            
            // Reset Filters
            document.getElementById('f-bright').value = 100; document.getElementById('f-cont').value = 100;
            document.getElementById('f-sat').value = 100; document.getElementById('f-gray').checked = false;
            document.getElementById('watermarkText').value = '';

            if (cropper) cropper.destroy();
            cropper = new Cropper(document.getElementById('cropperImage'), {
                viewMode: 1, autoCropArea: 1,
                crop(e) { document.getElementById('resizeW').value = Math.round(e.detail.width); document.getElementById('resizeH').value = Math.round(e.detail.height); }
            });
        }

        function closeEditor() { document.getElementById('editorModal').style.display = 'none'; if(cropper) cropper.destroy(); }
        document.getElementById('cancelEditBtn').onclick = closeEditor;

        function flipX() { scaleX = scaleX === 1 ? -1 : 1; cropper.scaleX(scaleX); }
        function flipY() { scaleY = scaleY === 1 ? -1 : 1; cropper.scaleY(scaleY); }

        document.querySelectorAll('#ratioControls button').forEach(btn => {
            btn.onclick = e => {
                document.querySelectorAll('#ratioControls button').forEach(b => b.style.borderColor = 'var(--border)');
                e.target.style.borderColor = 'var(--primary)';
                cropper.setAspectRatio(parseFloat(e.target.dataset.ratio));
            };
        });

        document.getElementById('applyEditBtn').onclick = () => {
            const w = parseInt(document.getElementById('resizeW').value) || 0;
            const h = parseInt(document.getElementById('resizeH').value) || 0;
            
            // 1. Get Crop
            const cropCanvas = cropper.getCroppedCanvas({ width: w>0?w:undefined, height: h>0?h:undefined });
            
            // 2. Apply Filters & Watermark via new Canvas
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = cropCanvas.width; finalCanvas.height = cropCanvas.height;
            const ctx = finalCanvas.getContext('2d');
            
            const b = document.getElementById('f-bright').value;
            const c = document.getElementById('f-cont').value;
            const s = document.getElementById('f-sat').value;
            const g = document.getElementById('f-gray').checked ? 'grayscale(100%)' : '';
            ctx.filter = `brightness(${b}%) contrast(${c}%) saturate(${s}%) ${g}`;
            
            ctx.drawImage(cropCanvas, 0, 0);
            ctx.filter = 'none'; // reset for watermark
            
            const wm = document.getElementById('watermarkText').value;
            if (wm) {
                ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
                ctx.font = `bold ${Math.max(14, finalCanvas.width * 0.03)}px sans-serif`;
                ctx.textAlign = "right";
                ctx.textBaseline = "bottom";
                
                // Shadow for readability
                ctx.shadowColor="black"; ctx.shadowBlur=4; ctx.lineWidth=2;
                ctx.strokeText(wm, finalCanvas.width - 15, finalCanvas.height - 15);
                ctx.shadowBlur=0;
                ctx.fillText(wm, finalCanvas.width - 15, finalCanvas.height - 15);
            }

            const newImg = new Image();
            newImg.onload = () => { uploadedImages[currentEditIndex].element = newImg; closeEditor(); renderGrid(); };
            newImg.src = finalCanvas.toDataURL('image/png');
        };

        // --- Settings & Export Logic ---
        const slider = document.getElementById('qualitySlider');
        const qualVal = document.getElementById('qualityVal');
        slider.oninput = () => qualVal.innerText = `${Math.round(slider.value * 100)}%`;

        function formatImg(imgElement, format, quality) {
            const cvs = document.createElement('canvas'); cvs.width = imgElement.width; cvs.height = imgElement.height;
            const ctx = cvs.getContext('2d');
            if (format === 'image/jpeg') { ctx.fillStyle = '#FFF'; ctx.fillRect(0,0,cvs.width,cvs.height); }
            ctx.drawImage(imgElement, 0, 0);
            return cvs.toDataURL(format, parseFloat(quality));
        }

        document.getElementById('convertBtn').onclick = async () => {
            if (!uploadedImages.length) return;
            const format = document.getElementById('formatSelect').value;
            const ext = format.split('/')[1] === 'jpeg' ? 'jpg' : format.split('/')[1];
            const q = slider.value;
            
            if (uploadedImages.length === 1) {
                const a = document.createElement('a');
                a.href = formatImg(uploadedImages[0].element, format, q);
                a.download = `export.${ext}`; a.click();
            } else {
                const zip = new JSZip();
                uploadedImages.forEach((item, i) => {
                    const dataUrl = formatImg(item.element, format, q);
                    zip.file(`image_${String(i+1).padStart(3,'0')}.${ext}`, dataUrl.split(',')[1], {base64: true});
                });
                const blob = await zip.generateAsync({type: "blob"});
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                a.download = `batch_export.zip`; a.click();
            }
        };

        document.getElementById('mergePdfBtn').onclick = () => {
            if (!uploadedImages.length) return;
            const { jsPDF } = window.jspdf; let pdf;
            uploadedImages.forEach((item, i) => {
                const img = item.element;
                const orient = img.width > img.height ? 'l' : 'p';
                if (i===0) pdf = new jsPDF({ orientation: orient, unit: 'px', format: [img.width, img.height] });
                else pdf.addPage([img.width, img.height], orient);
                pdf.addImage(img.src, 'PNG', 0, 0, img.width, img.height);
            });
            pdf.save('merged_document.pdf');
        };

        document.getElementById('copyBtn').onclick = () => {
            if (!uploadedImages.length) return;
            const btn = document.getElementById('copyBtn');
            const cvs = document.createElement('canvas');
            cvs.width = uploadedImages[0].element.width; cvs.height = uploadedImages[0].element.height;
            cvs.getContext('2d').drawImage(uploadedImages[0].element, 0, 0);
            cvs.toBlob(blob => {
                try {
                    navigator.clipboard.write([new ClipboardItem({'image/png': blob})]).then(() => {
                        const og = btn.innerText; btn.innerText = '✅ Copied!'; setTimeout(() => btn.innerText = og, 2000);
                    });
                } catch(e) { alert('Clipboard error'); }
            }, 'image/png');
        };

        document.getElementById('clearBtn').onclick = () => { uploadedImages = []; renderGrid(); };
    </script>
</body>
</html>
